<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>FC Mobile Single Player Builder</title>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"/>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#06060d;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:14px 10px 60px;
  color:white;
  font-family:"Anton",sans-serif;
}

/* ================= PANEL ================= */

.panel{
  width:100%;
  max-width:560px;

  background:rgba(255,255,255,0.04);

  border:
    1px solid rgba(124,58,237,0.22);

  border-radius:14px;

  padding:14px;

  margin-bottom:12px;
}

.panel-title{
  font-size:10px;
  letter-spacing:2px;
  color:#b28cff;
  margin-bottom:10px;
  font-family:"Poppins",sans-serif;
  text-transform:uppercase;
  font-weight:700;
}

.row{
  display:flex;
  gap:8px;
  margin-bottom:8px;
  flex-wrap:wrap;
}

.input{
  flex:1;

  background:rgba(255,255,255,0.05);

  border:
    1px solid rgba(255,255,255,0.08);

  border-radius:8px;

  padding:9px 10px;

  color:white;

  outline:none;

  font-family:"Poppins",sans-serif;
}

.btn{
  padding:10px 14px;

  border:none;

  border-radius:10px;

  cursor:pointer;

  font-weight:700;

  font-family:"Poppins",sans-serif;

  color:white;
}

.btn-purple{
  background:
    linear-gradient(
      135deg,
      #7c3aed,
      #4f46e5
    );
}

.btn-gold{
  background:
    linear-gradient(
      135deg,
      #d4b45f,
      #f5d78e
    );

  color:black;
}

/* ================= CARD ================= */

#capture{
  position:relative;

  width:560px;
  max-width:100%;

  border-radius:18px;

  overflow:hidden;

  background:

    repeating-linear-gradient(
      45deg,
      transparent,
      transparent 44px,
      rgba(255,255,255,0.01) 44px,
      rgba(255,255,255,0.01) 45px
    ),

    linear-gradient(
      170deg,
      #1c0a40 0%,
      #0e1430 30%,
      #081820 65%,
      #050e14 100%
    );

  box-shadow:
    0 0 0 1px rgba(255,255,255,0.05),
    0 30px 80px rgba(0,0,0,0.9);
}

#capture::before{
  content:"";

  position:absolute;

  top:0;
  left:0;
  right:0;

  height:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #7c3aed,
      #a855f7,
      #7c3aed,
      transparent
    );

  opacity:0.9;
}

#capture::after{
  content:"";

  position:absolute;

  inset:0;

  background:
    radial-gradient(circle at 20% 20%, rgba(124,58,237,0.18), transparent 35%),
    radial-gradient(circle at 80% 70%, rgba(0,200,120,0.10), transparent 40%);

  pointer-events:none;
}

/* ================= HOOK ================= */

.hook{
  text-align:center;

  padding:24px 16px 14px;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,0.35),
      transparent
    );
}

.hook1{
  font-family:"Bebas Neue",sans-serif;

  font-size:64px;

  line-height:1;

  letter-spacing:2px;

  text-shadow:
    0 0 28px rgba(168,85,247,0.6),
    3px 3px 0 rgba(0,0,0,0.9);

  animation:pulse 2s infinite;
}

.hook2{
  font-family:"Bebas Neue",sans-serif;

  font-size:22px;

  letter-spacing:4px;

  color:#f5d78e;

  margin-top:4px;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.03);}
  100%{transform:scale(1);}
}

/* ================= PLAYER ================= */

.player{
  padding:14px;
  padding-bottom:6px;
}

.top{
  display:flex;
  gap:12px;
  align-items:flex-start;
}

/* ================= CARD IMAGE ================= */

.card-wrap{
  position:relative;

  width:112px;

  flex-shrink:0;
}

.card-wrap input{
  position:absolute;
  inset:0;
  opacity:0;
  cursor:pointer;
  z-index:5;
}

.card-img{
  width:112px;
  height:134px;
  object-fit:contain;

  filter:
    drop-shadow(0 8px 18px rgba(124,58,237,0.45));
}

.card-hint{
  text-align:center;

  margin-top:4px;

  font-size:9px;

  color:rgba(255,255,255,0.28);

  font-family:"Poppins",sans-serif;
}

/* ================= INFO ================= */

.info{
  flex:1;
}

.pname{
  width:100%;

  background:none;
  border:none;
  outline:none;

 color:rgba(255,255,255,0.94);
  font-size:24px;

  line-height:1;

  font-family:"Anton",sans-serif;

  text-transform:uppercase;

  margin-top:2px;

  margin-bottom:8px;

  letter-spacing:0.5px;
}
.bio{

  display:flex;

  align-items:center;

  flex-wrap:wrap;

  gap:14px;

  margin-top:2px;
  margin-bottom:14px;

  color:rgba(255,255,255,0.82);

  font-size:13px;

  line-height:1;

  font-family:"Poppins",sans-serif;
}
.bio span{

  position:relative;
}

.bio span:nth-child(-n+3)::after{

  content:"";

  position:absolute;

  right:-8px;
  top:2px;

  width:1px;
  height:12px;

  background:rgba(255,255,255,0.18);
}
.bio input{

  background:none;
  border:none;
  outline:none;

  color:rgba(255,255,255,0.72);

  font-size:12px;

  font-family:"Poppins",sans-serif;

  width:auto;

  flex:none;

  white-space:nowrap;
}
.sep{

  color:rgba(255,255,255,0.22);

  font-size:11px;

  flex:none;
}
.pf-label{

  color:rgba(255,255,255,0.72);
}
.pf-value{

  color:#7ec8ff;

  font-weight:700;

  letter-spacing:0.5px;

  outline:none;
}
/* ================= STATS BOX ================= */

.stats-box{

  margin-top:10px;

  display:flex;
  align-items:center;

  gap:10px;

  background:
    linear-gradient(
      180deg,
      rgba(8,18,24,0.96),
      rgba(5,16,20,0.94)
    );

  border:
    1px solid rgba(0,180,120,0.08);

  border-radius:10px;

  padding:10px 12px;
}

.ovr{
  width:82px;

  border-right:
    1px solid rgba(255,255,255,0.08);

  display:flex;
  flex-direction:column;
  align-items:center;
  padding-right:12px;
}

.ovr-label{
  font-size:10px;

  color:rgba(255,255,255,0.45);

  font-family:"Poppins",sans-serif;
}

.ovr-num{

  font-size:52px;

  line-height:0.9;

  outline:none;

  letter-spacing:-1px;
}

.stats{
  flex:1;

  display:grid;

  grid-template-columns:repeat(6,1fr);

  gap:6px;
}

.stat{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.stat-num{

  width:100%;

  height:42px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:6px;

  transition:0.2s;

  position:relative;

  background:rgba(255,255,255,0.02);
}
.stat-num.best{

  color:#59f08d;

  background:
    linear-gradient(
      180deg,
      rgba(89,240,141,0.12),
      rgba(89,240,141,0.05)
    );

  border:
    1px solid rgba(89,240,141,0.06);

  box-shadow:none;
}

.stat input{

  transform:translateY(-1px);

  width:100%;

  background:none;
  border:none;
  outline:none;

  color:#72c78f;

  text-align:center;

  font-size:20px;

  line-height:1;

  font-family:"Anton",sans-serif;

  letter-spacing:0px;
}

.stat-num.best input{

  color:#59f08d;

}

.stat-label{

  margin-top:2px;

  font-size:10px;
letter-spacing:0.3px;
  line-height:1;

  color:rgba(255,255,255,0.42);

  font-family:"Poppins",sans-serif;

  font-weight:600;
}

/* ================= DETAILS ================= */

.details{
  margin-top:10px;
}

.drow{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:7px 0;

  border-bottom:
    1px solid rgba(255,255,255,0.05);
}

.dlabel{
  font-size:12px;

  color:rgba(255,255,255,0.58);

  font-family:"Poppins",sans-serif;
}

.dval{
  color:#4ade80;

  font-size:14px;

  outline:none;
}

/* ================= STARS ================= */

.stars{
  display:flex;
  gap:2px;
}

.star-svg{
  width:16px;
  height:16px;

  cursor:pointer;

  transition:0.12s;
}

.star-svg:hover{
  transform:scale(1.15);
}

/* ================= POWER SCORE ================= */
.verdict{

  margin:12px 14px 8px;

  height:52px;

  border-radius:10px;

  background:
    linear-gradient(
      90deg,
      rgba(8,22,24,0.96),
      rgba(5,28,20,0.92)
    );

  border:
    1px solid rgba(0,200,120,0.08);

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 18px;
}

.verdict-label{

  font-size:11px;

  letter-spacing:2px;

  color:rgba(255,255,255,0.42);

  font-family:"Poppins",sans-serif;

  font-weight:600;
}

.verdict-score{

  font-size:40px;

  line-height:1;

  color:#4ade80;

  font-family:"Anton",sans-serif;
}

/* ================= CTA ================= */

.cta{
  margin:0 14px 8px;

  background:rgba(255,255,255,0.04);

  border-radius:12px;

  padding:14px;

  text-align:center;

  font-size:18px;

  letter-spacing:2px;

  font-family:"Bebas Neue",sans-serif;
}

/* ================= WM ================= */

.wm{
  text-align:right;

  padding:8px 16px 12px;

  color:rgba(212,180,95,0.5);

  font-size:13px;

  font-family:"Poppins",sans-serif;
}

/* ================= MOBILE ================= */

@media(max-width:580px){

  .card-wrap{
    width:90px;
  }

  .card-img{
    width:90px;
    height:108px;
  }

  .pname{
    font-size:24px;
  }

  .hook1{
    font-size:52px;
  }

  .ovr-num{
    font-size:30px;
  }

  .stat input{
    font-size:15px;
  }

}


</style>
</head>

<body>

<!-- ================= CONTROLS ================= -->

<div class="panel">

  <div class="panel-title">
    HOOK TEXT
  </div>

  <div class="row">
    <input class="input" id="h1" placeholder="BROKEN CARD? 🔥">
  </div>

  <div class="row">
    <input class="input" id="h2" placeholder="Best CM In Game? 👀">
  </div>

  <div class="row">

    <button class="btn btn-purple" onclick="applyHook()">
      APPLY
    </button>

    <button class="btn btn-gold" onclick="downloadPNG()">
      DOWNLOAD PNG
    </button>

  </div>

</div>

<!-- ================= CARD ================= -->

<div id="capture">

  <div class="hook">

    <div class="hook1" id="hook1">
      CM BATTLE
    </div>

    <div class="hook2" id="hook2">
      WHO WINS
    </div>

  </div>

  <div class="player">

    <div class="top">

      <!-- CARD -->

      <div class="card-wrap">

        <input type="file" accept="image/*" onchange="upload(event)">

        <img class="card-img" id="cardImg">

        <div class="card-hint">
          TAP TO UPLOAD
        </div>

      </div>

      <!-- INFO -->

      <div class="info">

        <input class="pname" value="Vitinha">

        <!-- BIO -->
<div class="bio">

  <span
    contenteditable="true"
    spellcheck="false">

    176cm

  </span>

  <span
    contenteditable="true"
    spellcheck="false">

    73kg

  </span>

  <span
    contenteditable="true"
    spellcheck="false">

    Age 25

  </span>

  <span class="pf-label">
    Preferred Foot
  </span>

  <span
    class="pf-value"
    contenteditable="true"
    spellcheck="false">

    4★5

  </span>

</div>

        <!-- STATS -->

        <div class="stats-box">

          <div class="ovr">

            <div class="ovr-label">
              OVR
            </div>

            <div class="ovr-num" contenteditable="true">
              124
            </div>

          </div>

          <div class="stats" id="stats"></div>

        </div>

        <!-- DETAILS -->

        <div class="details">

          <div class="drow">

            <div class="dlabel">
              Position
            </div>

            <div class="dval" contenteditable="true">
              CM
            </div>

          </div>

          <div class="drow">

            <div class="dlabel">
              Stamina
            </div>

            <div class="stars" id="staminaStars"></div>

          </div>

          <div class="drow">

            <div class="dlabel">
              Skill Moves
            </div>

            <div class="stars" id="skillStars"></div>

          </div>

        </div>

      </div>

    </div>

  </div>

  <!-- POWER SCORE -->

<div class="verdict">

  <span class="verdict-label">
    TOTAL POWER
  </span>

  <span class="verdict-score" id="powerScore">
    600
  </span>

</div>

  <!-- CTA -->

  <!-- WM -->

  <div class="wm">
    GameEnclave
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>

const labels = ["PAC","SHO","PAS","DRI","DEF","PHY"];

const values = [100,100,100,100,100,100];

/* ================= HOOK ================= */

function applyHook(){

  document.getElementById("hook1").innerText =
    document.getElementById("h1").value || "CM BATTLE";

  document.getElementById("hook2").innerText =
    document.getElementById("h2").value || "WHO WINS";

}

/* ================= BUILD STATS ================= */

const stats = document.getElementById("stats");

labels.forEach((l,i)=>{

  stats.innerHTML += `

  <div class="stat">

    <div class="stat-num">

      <input
        value="${values[i]}"
        oninput="updatePower()">

    </div>

    <div class="stat-label">
      ${l}
    </div>

  </div>

  `;

});

/* ================= POWER ================= */

function updatePower(){

  let sum = 0;

  document.querySelectorAll(".stat input")
    .forEach(inp => {

      sum += Number(inp.value) || 0;

    });
highlightStats();
  document.getElementById("powerScore")
    .innerText = sum;

}

updatePower();
document.querySelector(".pname")
.addEventListener("input",e=>{

  e.target.value =
    e.target.value.toUpperCase();

});
function highlightStats(){

  document
    .querySelectorAll(".stat-num")
    .forEach(el=>el.classList.remove("best"));

  let max = 0;

  const inputs =
    document.querySelectorAll(".stat input");

  inputs.forEach(inp=>{

    const val = Number(inp.value)||0;

    if(val > max) max = val;

  });

  inputs.forEach(inp=>{

    const val = Number(inp.value)||0;

    if(val === max && max >= 140){

      inp.parentElement.classList.add("best");

    }

  });

}

/* ================= IMAGE ================= */

function upload(e){

  const file = e.target.files[0];

  if(!file) return;

  document.getElementById("cardImg")
    .src = URL.createObjectURL(file);

}

/* ================= STARS ================= */

function makeStar(type){

  const id = "g" + Math.random().toString(36).slice(2,7);

  if(type === "full"){

    return `
    <svg class="star-svg" viewBox="0 0 24 24">
      <polygon
        points="12,2 15,8 22,9 17,14 18,21 12,18 6,21 7,14 2,9 9,8"
        fill="#ffd000">
      </polygon>
    </svg>
    `;

  }

  if(type === "half"){

    return `
    <svg class="star-svg" viewBox="0 0 24 24">

      <defs>

        <linearGradient id="${id}">
          <stop offset="50%" stop-color="#ffd000"/>
          <stop offset="50%" stop-color="rgba(255,255,255,0.12)"/>
        </linearGradient>

      </defs>

      <polygon
        points="12,2 15,8 22,9 17,14 18,21 12,18 6,21 7,14 2,9 9,8"
        fill="url(#${id})">
      </polygon>

    </svg>
    `;

  }

  return `
  <svg class="star-svg" viewBox="0 0 24 24">
    <polygon
      points="12,2 15,8 22,9 17,14 18,21 12,18 6,21 7,14 2,9 9,8"
      fill="rgba(255,255,255,0.15)">
    </polygon>
  </svg>
  `;

}

function renderStars(el,val){

  const wrap = document.getElementById(el);

  wrap.innerHTML = "";

  for(let i=1;i<=5;i++){

    let type = "empty";

    if(val >= i){
      type = "full";
    }
    else if(val >= i - 0.5){
      type = "half";
    }

    const div = document.createElement("div");

    div.innerHTML = makeStar(type);

    const svg = div.firstElementChild;

    svg.addEventListener("click",()=>{

      renderStars(el,val === i ? i - 0.5 : i);

    });

    svg.addEventListener("contextmenu",(e)=>{

      e.preventDefault();

      renderStars(el,i - 0.5);

    });

    wrap.appendChild(svg);

  }

}

renderStars("staminaStars",4.5);
renderStars("skillStars",3);

/* ================= DOWNLOAD ================= */

async function downloadPNG(){

  const canvas =
    await html2canvas(
      document.getElementById("capture"),
      {
        scale:6,
        backgroundColor:"#06060d",
        useCORS:true
      }
    );

  const link = document.createElement("a");

  link.download = "FCMobile_Player.png";

  link.href = canvas.toDataURL("image/png");

  link.click();

}

</script>

</body>
</html>
