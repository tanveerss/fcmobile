<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FC Mobile Comparison</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:#06060d;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:14px 10px 60px;
  color:white;
  font-family:"Anton",sans-serif;
}

/* ===== PANELS ===== */
.panel{
  width:100%;max-width:560px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(124,58,237,0.22);
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
}
.panel-title{
  font-size:10px;letter-spacing:2px;color:#b28cff;
  margin-bottom:10px;font-family:"Poppins",sans-serif;
  text-transform:uppercase;font-weight:700;
}
.row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.input{
  flex:1;background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:8px;padding:9px 10px;
  color:white;outline:none;font-family:"Poppins",sans-serif;
}
.btn{
  padding:10px 14px;border:none;border-radius:10px;
  cursor:pointer;font-weight:700;
  font-family:"Poppins",sans-serif;color:white;
}
.btn-purple{background:linear-gradient(135deg,#7c3aed,#4f46e5);}
.btn-gold{background:linear-gradient(135deg,#d4b45f,#f5d78e);color:black;}

/* ===== CAPTURE ===== */
#capture{
  position:relative;
  width:560px;max-width:100%;
  border-radius:18px;overflow:hidden;
  background:
    repeating-linear-gradient(45deg,transparent,transparent 44px,rgba(255,255,255,0.01) 44px,rgba(255,255,255,0.01) 45px),
    linear-gradient(170deg,#1c0a40 0%,#0e1430 30%,#081820 65%,#050e14 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,0.05),0 30px 80px rgba(0,0,0,0.9);
}
#capture::before{
  content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,#7c3aed,#a855f7,#7c3aed,transparent);
  opacity:0.9;
}
#capture::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
}

/* ===== HOOK ===== */
.hook{
  text-align:center;
  padding:24px 16px 14px;
  background:linear-gradient(180deg,rgba(0,0,0,0.35),transparent);
}
.hook1{
  font-family:"Bebas Neue",sans-serif;
  font-size:64px;line-height:1;letter-spacing:2px;
  text-shadow:0 0 28px rgba(168,85,247,0.6),3px 3px 0 rgba(0,0,0,0.9);
  animation:pulse 2s infinite;
}
.hook2{
  font-family:"Bebas Neue",sans-serif;
  font-size:22px;letter-spacing:4px;color:#f5d78e;margin-top:4px;
}
@keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.03);}100%{transform:scale(1);}}

/* ===== PLAYER BLOCK ===== */
.player{
  padding:14px;
  padding-bottom:6px;
  border-top:1px solid rgba(255,255,255,0.06);
  background:rgba(124,58,237,0.1);
}
.player:first-of-type{border-top:none;background:rgba(124,58,237,0.1);}

.top{display:flex;gap:12px;align-items:flex-start;}

/* ===== CARD IMAGE ===== */
.card-wrap{position:relative;width:112px;flex-shrink:0;}
.card-wrap input{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:5;}
.card-img{width:112px;height:134px;object-fit:contain;filter:drop-shadow(0 8px 18px rgba(124,58,237,0.45));}
.card-hint{text-align:center;margin-top:4px;font-size:9px;color:rgba(255,255,255,0.28);font-family:"Poppins",sans-serif;}

/* ===== INFO ===== */
.info{flex:1;}
.pname{
  width:100%;background:none;border:none;outline:none;
  color:rgba(255,255,255,0.94);font-size:24px;line-height:1;
  font-family:"Anton",sans-serif;text-transform:uppercase;
  margin-top:2px;margin-bottom:8px;letter-spacing:0.5px;
}

/* ===== BIO — exact same as single player ===== */
.bio{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:14px;
  margin-top:2px;
  margin-bottom:14px;
  color:rgba(255,255,255,0.82);
  font-size:13px;
  line-height:1;
  font-family:"Poppins",sans-serif;
}
.bio span{position:relative;}
.bio span:nth-child(-n+3)::after{
  content:"";position:absolute;
  right:-8px;top:2px;
  width:1px;height:12px;
  background:rgba(255,255,255,0.18);
}
.bio input{
  background:none;border:none;outline:none;
  color:rgba(255,255,255,0.72);
  font-size:12px;font-family:"Poppins",sans-serif;
  width:auto;flex:none;white-space:nowrap;
}
.sep{color:rgba(255,255,255,0.22);font-size:11px;flex:none;}
.pf-label{color:rgba(255,255,255,0.72);}
.pf-value{color:#7ec8ff;font-weight:700;letter-spacing:0.5px;outline:none;}

/* ===== STATS BOX ===== */
.stats-box{
  margin-top:10px;
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,rgba(8,18,24,0.96),rgba(5,16,20,0.94));
  border:1px solid rgba(0,180,120,0.08);
  border-radius:10px;padding:10px 12px;
}
.ovr{
  width:62px;
  border-right:1px solid rgba(255,255,255,0.08);
  display:flex;flex-direction:column;align-items:center;
  padding-right:10px;flex-shrink:0;
}
.ovr-label{font-size:10px;color:rgba(255,255,255,0.45);font-family:"Poppins",sans-serif;}
.ovr-num{font-size:36px;line-height:0.9;outline:none;letter-spacing:-1px;}

.stats{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;}
.stat{display:flex;flex-direction:column;align-items:center;}
.stat-num{
  width:100%;height:36px;
  display:flex;align-items:center;justify-content:center;
  border-radius:6px;transition:0.2s;position:relative;
  background:rgba(255,255,255,0.02);
}
.stat-num.best{
  color:#59f08d;
  background:linear-gradient(180deg,rgba(89,240,141,0.12),rgba(89,240,141,0.05));
  border:1px solid rgba(89,240,141,0.06);
}
.stat input{
  transform:translateY(-1px);
  width:100%;background:none;border:none;outline:none;
  color:#72c78f;text-align:center;
  font-size:17px;line-height:1;
  font-family:"Anton",sans-serif;letter-spacing:0;
  -moz-appearance:textfield;
}
.stat input::-webkit-inner-spin-button,
.stat input::-webkit-outer-spin-button{-webkit-appearance:none;}

/* Stat value colors by range */
.stat-num.val-red input  { color:#ff4444; }
.stat-num.val-yellow input { color:#f5c518; }
.stat-num.val-green input  { color:#72c78f; }
.stat-num.best input { color:#59f08d; }
.stat-label{
  margin-top:2px;font-size:9px;letter-spacing:0.3px;line-height:1;
  color:rgba(255,255,255,0.42);
  font-family:"Poppins",sans-serif;font-weight:600;
}

/* ===== FORMAT TOGGLE — only spacing, nothing else ===== */

/* Instagram 4:5 — compact */
#capture.fmt-instagram .hook{ padding:14px 16px 8px; }
#capture.fmt-instagram .hook1{ font-size:48px; }
#capture.fmt-instagram .hook2{ font-size:18px; margin-top:2px; }
#capture.fmt-instagram .player{ padding:8px 14px 4px; }
#capture.fmt-instagram .card-img{ height:110px; }
#capture.fmt-instagram .card-wrap{ width:92px; }
#capture.fmt-instagram .card-img{ width:92px; }
#capture.fmt-instagram .pname{ font-size:20px; margin-bottom:4px; }
#capture.fmt-instagram .bio{ gap:10px; margin-bottom:8px; font-size:11px; }
#capture.fmt-instagram .stats-box{ padding:7px 10px; margin-top:6px; }
#capture.fmt-instagram .stat-num{ height:28px; }
#capture.fmt-instagram .stat input{ font-size:14px; }
#capture.fmt-instagram .ovr-num{ font-size:28px; }
#capture.fmt-instagram .details{ margin-top:6px; }
#capture.fmt-instagram .drow{ padding:4px 0; }
#capture.fmt-instagram .dlabel{ font-size:11px; }
#capture.fmt-instagram .star-svg{ width:12px; height:12px; }
#capture.fmt-instagram .drow-total{ padding:5px 0 2px; }
#capture.fmt-instagram .total-val{ font-size:18px; }
#capture.fmt-instagram .wm{ padding:4px 16px 8px; }

/* YT Shorts 9:16 — medium compact */
#capture.fmt-shorts .hook{ padding:18px 16px 10px; }
#capture.fmt-shorts .hook1{ font-size:56px; }
#capture.fmt-shorts .player{ padding:10px 14px 4px; }
#capture.fmt-shorts .card-img{ height:120px; }
#capture.fmt-shorts .card-wrap{ width:100px; }
#capture.fmt-shorts .card-img{ width:100px; }
#capture.fmt-shorts .pname{ font-size:22px; margin-bottom:6px; }
#capture.fmt-shorts .bio{ gap:12px; margin-bottom:10px; }
#capture.fmt-shorts .stats-box{ padding:8px 10px; margin-top:8px; }
#capture.fmt-shorts .stat-num{ height:32px; }
#capture.fmt-shorts .stat input{ font-size:15px; }
#capture.fmt-shorts .ovr-num{ font-size:32px; }
#capture.fmt-shorts .details{ margin-top:8px; }
#capture.fmt-shorts .drow{ padding:5px 0; }
#capture.fmt-shorts .star-svg{ width:13px; height:13px; }
#capture.fmt-shorts .drow-total{ padding:6px 0 3px; }
#capture.fmt-shorts .wm{ padding:6px 16px 10px; }

/* ===== DETAILS ===== */
.details{margin-top:10px;}
.drow{
  display:flex;justify-content:space-between;align-items:center;
  padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.05);
}
.dlabel{font-size:12px;color:rgba(255,255,255,0.58);font-family:"Poppins",sans-serif;}
.dval{color:#4ade80;font-size:14px;outline:none;}

/* Position — primary green, secondary white */
.pos-wrap{display:flex;align-items:center;gap:0;}
.pos-primary{color:#4ade80;font-size:14px;outline:none;font-family:"Anton",sans-serif;min-width:4px;}
.pos-secondary{color:rgba(255,255,255,0.75);font-size:14px;outline:none;font-family:"Anton",sans-serif;min-width:4px;}
.pos-secondary:empty::before{content:", RM, RW";color:rgba(255,255,255,0.2);pointer-events:none;}
.stars{display:flex;gap:2px;}
.star-svg{width:14px;height:14px;cursor:pointer;transition:0.12s;}
.star-svg:hover{transform:scale(1.15);}

/* ===== PLAYER TOTAL POWER ROW ===== */
.drow-total{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0 4px;
  border-top:1px solid rgba(255,255,255,0.08);
  margin-top:2px;
}
.total-label{
  font-size:11px;letter-spacing:1.5px;
  color:rgba(255,255,255,0.42);
  font-family:"Poppins",sans-serif;font-weight:600;
  text-transform:uppercase;
}
.total-val{
  font-size:22px;font-family:"Anton",sans-serif;
  color:#4ade80;line-height:1;
  display:flex;align-items:center;gap:6px;
}
.total-val.winner{ color:#f5d78e; }
.total-crown{ font-size:16px;line-height:1; }

/* ===== WM ===== */
.wm{text-align:right;padding:8px 16px 12px;color:rgba(212,180,95,0.5);font-size:13px;font-family:"Poppins",sans-serif;}

/* ===== EXPORT ===== */
#capture.exporting .card-hint{display:none!important;}

/* ===== MOBILE ===== */
@media(max-width:580px){
  .card-wrap{width:90px;}
  .card-img{width:90px;height:108px;}
  .pname{font-size:20px;}
  .hook1{font-size:48px;}
  .ovr-num{font-size:28px;}
  .stat input{font-size:14px;}
}

/* ===== TOAST ===== */
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:#1a1030;color:#fff;
  padding:11px 20px;border-radius:10px;font-size:13px;z-index:99999;
  border:1px solid rgba(124,58,237,0.4);
  box-shadow:0 4px 22px rgba(0,0,0,0.7);
  transition:opacity 0.4s;opacity:0;
  max-width:90vw;text-align:center;
  font-family:"Poppins",sans-serif;pointer-events:none;
}
</style>
</head>
<body>

<!-- CONTROLS -->
<div class="panel">
  <div class="panel-title">HOOK TEXT</div>
  <div class="row">
    <input class="input" id="h1" placeholder="CM BATTLE 🔥"/>
  </div>
  <div class="row">
    <input class="input" id="h2" placeholder="WHO WINS? 👀"/>
  </div>
  <div class="row">
    <button class="btn btn-purple" onclick="applyHook()">APPLY</button>
    <button class="btn btn-gold" onclick="downloadPNG()">📥 DOWNLOAD PNG</button>
  </div>
  <div class="panel-title" style="margin-top:8px;">FORMAT</div>
  <div class="row">
    <button class="btn btn-purple" id="btnDefault" onclick="setFormat('default')" style="flex:1">📱 Default</button>
    <button class="btn" id="btnInsta" onclick="setFormat('instagram')" style="flex:1;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);">📷 Instagram 4:5</button>
    <button class="btn" id="btnShorts" onclick="setFormat('shorts')" style="flex:1;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);">▶ YT Shorts</button>
  </div>
</div>

<!-- CAPTURE -->
<div id="capture">

  <!-- HOOK -->
  <div class="hook">
    <div class="hook1" id="hook1">CM BATTLE</div>
    <div class="hook2" id="hook2">WHO WINS</div>
  </div>

  <!-- 2 PLAYERS -->
  <div class="player" id="p0"></div>
  <div class="player" id="p1"></div>

  <div class="wm">GameEnclave</div>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const LABELS = ["PAC","SHO","PAS","DRI","DEF","PHY"];
const imgUrls = ["",""];
const starVals = [
  {stamina:4.5, skill:3},
  {stamina:4.5, skill:3},
];

/* ===== FORMAT TOGGLE ===== */
function setFormat(fmt){
  const cap = document.getElementById("capture");
  cap.classList.remove("fmt-instagram","fmt-shorts");
  if(fmt==="instagram") cap.classList.add("fmt-instagram");
  if(fmt==="shorts") cap.classList.add("fmt-shorts");
  ["btnDefault","btnInsta","btnShorts"].forEach(id=>{
    const b = document.getElementById(id);
    b.style.background = "rgba(255,255,255,0.07)";
    b.style.border = "1px solid rgba(255,255,255,0.12)";
    b.style.color = "white";
  });
  const activeMap = {default:"btnDefault",instagram:"btnInsta",shorts:"btnShorts"};
  const ab = document.getElementById(activeMap[fmt]);
  ab.style.background = "linear-gradient(135deg,#7c3aed,#4f46e5)";
  ab.style.border = "none";
}

/* ===== HOOK ===== */
function applyHook(){
  document.getElementById("hook1").innerText = document.getElementById("h1").value || "CM BATTLE";
  document.getElementById("hook2").innerText = document.getElementById("h2").value || "WHO WINS";
}

/* ===== STARS — exact from single player ===== */
function makeStar(type){
  const id = "g"+Math.random().toString(36).slice(2,7);
  if(type==="full") return `<svg class="star-svg" viewBox="0 0 24 24"><polygon points="12,2 15,8 22,9 17,14 18,21 12,18 6,21 7,14 2,9 9,8" fill="#ffd000"/></svg>`;
  if(type==="half") return `<svg class="star-svg" viewBox="0 0 24 24"><defs><linearGradient id="${id}"><stop offset="50%" stop-color="#ffd000"/><stop offset="50%" stop-color="rgba(255,255,255,0.12)"/></linearGradient></defs><polygon points="12,2 15,8 22,9 17,14 18,21 12,18 6,21 7,14 2,9 9,8" fill="url(#${id})"/></svg>`;
  return `<svg class="star-svg" viewBox="0 0 24 24"><polygon points="12,2 15,8 22,9 17,14 18,21 12,18 6,21 7,14 2,9 9,8" fill="rgba(255,255,255,0.15)"/></svg>`;
}

function renderStars(elId, val){
  const wrap = document.getElementById(elId);
  if(!wrap) return;
  wrap.innerHTML = "";
  for(let i=1;i<=5;i++){
    let type = val>=i ? "full" : val>=i-0.5 ? "half" : "empty";
    const div = document.createElement("div");
    div.innerHTML = makeStar(type);
    const svg = div.firstElementChild;
    svg.addEventListener("click",()=>{
      const p = parseInt(elId.split("_")[1]);
      const t = elId.split("_")[0];
      starVals[p][t] = (starVals[p][t]===i) ? i-0.5 : i;
      renderStars(elId, starVals[p][t]);
    });
    svg.addEventListener("contextmenu",(e)=>{
      e.preventDefault();
      const p = parseInt(elId.split("_")[1]);
      const t = elId.split("_")[0];
      starVals[p][t] = i-0.5;
      renderStars(elId, starVals[p][t]);
    });
    wrap.appendChild(svg);
  }
}

/* ===== STAT COLOR BY VALUE ===== */
function applyStatColor(inp){
  const val = parseInt(inp.value)||0;
  const sn = inp.parentElement;
  sn.classList.remove("val-red","val-yellow","val-green");
  if(val < 70) sn.classList.add("val-red");
  else if(val <= 100) sn.classList.add("val-yellow");
  else sn.classList.add("val-green");
}

/* ===== BUILD PLAYER BLOCK ===== */
function buildPlayer(p){
  const block = document.getElementById("p"+p);
  block.innerHTML = `
    <div class="top">
      <!-- CARD -->
      <div class="card-wrap">
        <input type="file" accept="image/*" onchange="uploadImg(event,${p})"/>
        <img class="card-img" id="cimg${p}" src="${imgUrls[p]}" alt=""/>
        <div class="card-hint">TAP TO UPLOAD</div>
      </div>

      <!-- INFO -->
      <div class="info">
        <input class="pname" id="pname${p}" placeholder="PLAYER ${p+1}" oninput="this.value=this.value.toUpperCase();updateTotals()"/>

        <!-- BIO — exact same structure as single player -->
        <div class="bio">
          <span contenteditable="true" spellcheck="false">176cm</span>
          <span contenteditable="true" spellcheck="false">73kg</span>
          <span contenteditable="true" spellcheck="false">Age 25</span>
          <span class="pf-label">Preferred Foot</span>
          <span class="pf-value" contenteditable="true" spellcheck="false">4★5</span>
        </div>

        <!-- STATS BOX -->
        <div class="stats-box">
          <div class="ovr">
            <div class="ovr-label">OVR</div>
            <div class="ovr-num" contenteditable="true" spellcheck="false">124</div>
          </div>
          <div class="stats" id="stats${p}"></div>
        </div>

        <!-- DETAILS -->
        <div class="details">
          <div class="drow">
            <div class="dlabel">Position</div>
            <div class="pos-wrap">
              <span class="pos-primary" contenteditable="true" spellcheck="false">CM</span><span class="pos-secondary" contenteditable="true" spellcheck="false"></span>
            </div>
          </div>
          <div class="drow">
            <div class="dlabel">Stamina</div>
            <div class="stars" id="stamina_${p}"></div>
          </div>
          <div class="drow">
            <div class="dlabel">Skill Moves</div>
            <div class="stars" id="skill_${p}"></div>
          </div>
          <div class="drow-total">
            <div class="total-label">Total Power</div>
            <div class="total-val" id="ptotal_${p}">600</div>
          </div>
        </div>

      </div>
    </div>
  `;

  // Build stat inputs
  const statsEl = document.getElementById("stats"+p);
  LABELS.forEach((l,i)=>{
    const div = document.createElement("div");
    div.className = "stat";
    div.innerHTML = `
      <div class="stat-num" data-p="${p}" data-s="${i}">
        <input type="number" value="100" min="0" max="999" oninput="onStatInput(this)"/>
      </div>
      <div class="stat-label">${l}</div>
    `;
    statsEl.appendChild(div);
    // Apply initial color
    const inp = div.querySelector("input");
    applyStatColor(inp);
  });

  // Render stars
  renderStars("stamina_"+p, starVals[p].stamina);
  renderStars("skill_"+p, starVals[p].skill);
}

/* ===== STAT INPUT ===== */
function onStatInput(inp){
  if(inp.value.length > 3) inp.value = inp.value.slice(0,3);
  applyStatColor(inp);
  highlightStats();
  updateTotals();
}

/* ===== UPLOAD ===== */
function uploadImg(e, p){
  const f = e.target.files[0];
  if(!f) return;
  imgUrls[p] = URL.createObjectURL(f);
  document.getElementById("cimg"+p).src = imgUrls[p];
}

/* ===== HIGHLIGHT ===== */
function highlightStats(){
  document.querySelectorAll(".stat-num").forEach(n=>n.classList.remove("best"));
  for(let si=0;si<6;si++){
    const cells = [];
    for(let pi=0;pi<2;pi++){
      const el = document.querySelector(`.stat-num[data-p="${pi}"][data-s="${si}"]`);
      const inp = el ? el.querySelector("input") : null;
      if(el && inp) cells.push({el, val: parseInt(inp.value)||0});
    }
    const mx = Math.max(...cells.map(c=>c.val));
    const allSame = cells.every(c=>c.val===mx);
    if(allSame) continue;
    cells.forEach(c=>{ if(c.val===mx) c.el.classList.add("best"); });
  }
}

/* ===== TOTALS ===== */
function updateTotals(){
  const totals = [];
  for(let pi=0;pi<2;pi++){
    let sum = 0;
    for(let si=0;si<6;si++){
      const inp = document.querySelector(`.stat-num[data-p="${pi}"][data-s="${si}"] input`);
      sum += inp ? (parseInt(inp.value)||0) : 0;
    }
    totals.push(sum);
  }
  const mx = Math.max(...totals);
  let winnerFound = false;
  totals.forEach((sum, pi)=>{
    const el = document.getElementById("ptotal_"+pi);
    if(!el) return;
    const isWinner = sum===mx && !winnerFound;
    if(isWinner) winnerFound = true;
    el.className = "total-val" + (isWinner ? " winner" : "");
    el.innerHTML = isWinner
      ? `<span class="total-crown">🏆</span>${sum}`
      : `${sum}`;
  });
}

/* ===== DOWNLOAD ===== */
async function downloadPNG(){
  showToast("⏳ Generating HD...");
  const cap = document.getElementById("capture");
  cap.classList.add("exporting");
  await new Promise(r=>setTimeout(r,300));
  try{
    const canvas = await html2canvas(cap,{
      scale:6,
      backgroundColor:"#06060d",
      useCORS:true,
      allowTaint:true,
      logging:false,
      imageTimeout:0
    });
    const a = document.createElement("a");
    a.download = "GameEnclave_Comparison.png";
    a.href = canvas.toDataURL("image/png",1.0);
    a.click();
    showToast("✅ HD Downloaded!");
  } catch(e){showToast("❌ Error — try again");}
  finally{cap.classList.remove("exporting");}
}

/* ===== TOAST ===== */
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.opacity = "1";
  clearTimeout(t._t); t._t = setTimeout(()=>{t.style.opacity="0";},3000);
}
